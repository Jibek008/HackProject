services:
  web:
    build: .
    container_name: hack_web
    environment:
      - LAB_HOST=0.0.0.0
      - LAB_PORT=5000
      - LAB_DEBUG=0
    volumes:
      - ./lab.db:/app/lab.db
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: hack_nginx
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped
